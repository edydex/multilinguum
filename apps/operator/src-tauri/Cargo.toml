[package]
name = "multilinguum-operator"
version = "0.1.0"
description = "Multilinguum church service operator console"
authors = ["Multilinguum contributors"]
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "multilinguum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
cpal = "0.16.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.8.5", features = [] }
