[project]
name = "multilinguum-voice-worker"
version = "0.1.0"
description = "Consent-gated Chatterbox Multilingual V3 voice rendering worker"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "cryptography>=45.0,<46",
  "fastapi>=0.116,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "soundfile>=0.13,<1",
  "uvicorn[standard]>=0.35,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
