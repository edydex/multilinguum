services:
  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PROCESSOR_HOST: 0.0.0.0
      PROCESSOR_PORT: 4310
      ARCHIVE_ROOT: /var/lib/multilinguum/archives
      VOICE_WORKER_URL: http://voice-worker:4320
    ports:
      - '4310:4310'
    volumes:
      - archive-data:/var/lib/multilinguum
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4310/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      voice-worker:
        condition: service_healthy

  voice-worker:
    build:
      context: services/voice-worker
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      VOICE_PROFILE_ROOT: /var/lib/multilinguum/voices
      CHATTERBOX_DEVICE: cuda
    volumes:
      - voice-data:/var/lib/multilinguum/voices
      - model-cache:/home/multilinguum/.cache
    expose:
      - '4320'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4320/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  archive-data:
  voice-data:
  model-cache:
